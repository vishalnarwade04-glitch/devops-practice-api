name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-practice-api .

      - name: Run tests inside container
        run: docker run --rm devops-practice-api pytest -v

  push:
    runs-on: ubuntu-latest
    needs: docker-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}


  smoke-test:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Playwright test dependencies
        run: |
          pip install pytest-playwright
          playwright install --with-deps chromium

      - name: Pull and run the published image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run -d -p 5000:5000 --name smoke-target ghcr.io/${{ github.repository }}:${{ github.sha }}
          sleep 5

      - name: Run smoke tests against the live container
        run: pytest test_smoke.py -v

      - name: Clean up container
        if: always()
        run: docker stop smoke-target && docker rm smoke-target
